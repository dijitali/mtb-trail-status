<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="description" content="Mountain bike trail map with difficulty grades and live open/closed status." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MTB Trail Status</title>
  </head>
  <body>
    <header class="topbar">
      <button id="panel-toggle" class="btn icon-btn" type="button" aria-controls="panel" aria-expanded="false" aria-label="Toggle trail list">☰</button>
      <h1 id="title">MTB Trail Status</h1>
      <span id="connectivity" class="pill" hidden>Offline</span>
    </header>
    <div class="layout">
      <aside id="panel" class="panel" aria-label="Trails"></aside>
      <div id="map" class="map">
        <div id="loading" class="loading">Loading trails…</div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
