name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Every park's trails must have cached geometry and profiles so the site works
      # offline and never depends on a live query. Fix with `PARK=<park> npm run fetch-geometry`.
      - run: npm run check-geometry
      - name: Build every park
        run: |
          set -e
          for dir in parks/*/; do
            park=$(basename "$dir")
            [ -f "$dir/park.json" ] || continue
            echo "::group::Build $park"
            PARK="$park" npx vite build --outDir "dist/$park"
            echo "::endgroup::"
          done
